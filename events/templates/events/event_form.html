{% extends "electronic_diary/home.html" %}

{% block title %}{{ view.object|default:"Нова подія" }}{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-3">
    {% if view.object %}Редагувати подію{% else %}Створити нову подію{% endif %}
  </h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Зберегти</button>
    <a href="{% url 'events:event_list' %}" class="btn btn-secondary">Скасувати</a>
  </form>
</div>
{% endblock %}
